name: build-ios

# Builds the AyuGram iOS client from this repository.
#
# This repository IS the fork: it contains the whole Swiftgram/Telegram-iOS tree
# with the AyuGram patch layer in `AyuGram/` and the upstream edits applied (see
# `AyuGram/patches/`). There is therefore nothing to clone — the build runs on the
# checkout itself.
#
# This is the primary build path, not a fallback. The project's own Mac mini is a
# Late 2012 model (Macmini6,2), confirmed by mDNS as `model=Macmini6,2 osxvers=19`,
# i.e. macOS 10.15 Catalina. The newest Xcode that runs on Catalina is 12.4, while
# this tree's versions.json requires macOS 26 + Xcode 26.2, so no local build is
# possible on that hardware.
#
# The runner image matters: it must ship the Xcode that versions.json asks for.
# Default is macos-26. If that image is unavailable on your account, pass macos-15;
# the workflow then detects the mismatch and adds --overrideXcodeVersion, which may
# or may not build — a mismatched Xcode is a real risk, not a formality.
#
# Required repository secrets:
#   TELEGRAM_API_ID      - from https://my.telegram.org/apps  (required)
#   TELEGRAM_API_HASH    - from https://my.telegram.org/apps  (required)
#   APPLE_TEAM_ID        - Apple Developer team id             (device builds only)
#
# The default configuration is a simulator build, which needs no Apple signing at
# all — enough to prove the tree compiles. A device IPA needs a distribution
# certificate and provisioning profiles on top.

on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS runner image (must provide the Xcode required by versions.json)
        default: macos-26
        required: true
      configuration:
        description: Build configuration
        default: release_sim_arm64
        type: choice
        options:
          - release_sim_arm64
          - release_arm64
          - debug_arm64
  push:
    branches: [ayugram-ios]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Verify patch layer (no toolchain needed)
        run: python3 AyuGram/tools/verify_all.py

      - name: Report toolchain versions
        run: |
          sw_vers
          xcodebuild -version
          python3 --version
          cat versions.json

      - name: Check required secrets
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${API_ID:-}" ]; then
            echo "::error::TELEGRAM_API_ID secret is not set. Get one at https://my.telegram.org/apps"
            missing=1
          fi
          if [ -z "${API_HASH:-}" ]; then
            echo "::error::TELEGRAM_API_HASH secret is not set. Get one at https://my.telegram.org/apps"
            missing=1
          fi
          exit $missing

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-${{ github.sha }}
          restore-keys: |
            bazel-${{ runner.os }}-${{ hashFiles('versions.json') }}-
            bazel-${{ runner.os }}-

      # Make.py compares the installed Xcode against versions.json and refuses to
      # build on a mismatch. That check is right locally and unhelpful on a hosted
      # runner, whose Xcode we cannot choose, so the flag is derived rather than
      # hard-coded.
      - name: Resolve Xcode override flag
        run: |
          set -euo pipefail
          OUTPUT=$(python3 - <<'PY'
          import json, pathlib, re, subprocess
          base = json.loads(pathlib.Path("versions.json").read_text())
          required = str(base.get("xcode") or "")
          installed = "unknown"
          out = subprocess.run(["xcodebuild", "-version"], capture_output=True, text=True).stdout
          m = re.search(r"Xcode\s+(\S+)", out)
          if m:
              installed = m.group(1)
          print(f"versions.json requires Xcode {required}; this runner has {installed}")
          print("OVERRIDE=" + ("--overrideXcodeVersion" if required and installed != required else ""))
          PY
          )
          echo "$OUTPUT"
          OVERRIDE=$(printf '%s\n' "$OUTPUT" | sed -n 's/^OVERRIDE=//p' | tail -1)
          if [ -n "$OVERRIDE" ]; then
            echo "::warning::Xcode differs from versions.json; building with $OVERRIDE"
          fi
          echo "XCODE_OVERRIDE_FLAG=$OVERRIDE" >> "$GITHUB_ENV"

      - name: Write build configuration
        env:
          API_ID: ${{ secrets.TELEGRAM_API_ID }}
          API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib, secrets, sys
          template = pathlib.Path(
              "build-system/template_minimal_development_configuration.json"
          )
          config = json.loads(template.read_text())
          config["api_id"] = os.environ["API_ID"]
          config["api_hash"] = os.environ["API_HASH"]
          config["bundle_id"] = f"org.{secrets.token_hex(8)}.AyuGram"
          config["team_id"] = os.environ.get("TEAM_ID") or ""

          out = pathlib.Path("build-config")
          out.mkdir(exist_ok=True)
          (out / "ci.json").write_text(json.dumps(config, indent=2))

          # Never echo the real credentials into a public build log.
          redacted = dict(config, api_id="***", api_hash="***")
          print(json.dumps(redacted, indent=2), file=sys.stderr)
          PY

      - name: Generate Xcode project
        run: |
          set -euo pipefail
          # Global option, so it precedes the subcommand (empty when Xcode matches).
          python3 build-system/Make/Make.py \
            ${XCODE_OVERRIDE_FLAG:-} \
            --cacheDir="$HOME/telegram-bazel-cache" \
            generateProject \
            --configurationPath="$GITHUB_WORKSPACE/build-config/ci.json" \
            --disableProvisioningProfiles

      - name: Build
        run: |
          set -euo pipefail
          python3 build-system/Make/Make.py \
            ${XCODE_OVERRIDE_FLAG:-} \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath="$GITHUB_WORKSPACE/build-config/ci.json" \
            --buildNumber="${{ github.run_number }}" \
            --configuration="${{ inputs.configuration || 'release_sim_arm64' }}" \
            --disableProvisioningProfiles

      - name: Locate build products
        if: always()
        run: |
          set -euo pipefail
          find . -maxdepth 6 \( -name '*.app' -o -name '*.ipa' -o -name '*.xcarchive' \) -print || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ayugram-ios-${{ inputs.configuration || 'release_sim_arm64' }}-${{ github.run_number }}
          path: |
            build/artifacts/**
            **/*.app
          if-no-files-found: warn
          retention-days: 14
